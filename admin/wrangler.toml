name = "moar-admin"
main = "src/worker.js"
compatibility_date = "2025-06-01"
# No per-version preview URLs: only the real admin address should exist.
preview_urls = false

# Only if moarguitars.com's DNS ever moves to Cloudflare: serve the admin at admin.moarguitars.com.
# routes = [{ pattern = "admin.moarguitars.com", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
GITHUB_REPO = "moarguitars/moarguitars"
GITHUB_BRANCH = "master"
SITE_URL = "https://moarguitars.com"
ADMIN_URL = "https://moar-admin.moarguitars.workers.dev"
# Sites allowed to send enquiries to this Worker.
SITE_ORIGINS = "https://moarguitars.com,https://www.moarguitars.com"
GA_MEASUREMENT_ID = "G-0SN8NVW37D"
# The GA4 property the Insights page reads (needs the GA_SERVICE_ACCOUNT secret).
GA_PROPERTY_ID = "361392069"
# Email alerts are submitted to this Formspree form, which emails whoever it's set up for.
FORMSPREE_FORM = "xgebpvey"

# Enquiries and payment requests. Create with `npx wrangler d1 create moar-admin`
# and paste the database_id it prints.
[[d1_databases]]
binding = "DB"
database_name = "moar-admin"
database_id = "c0bf2b24-53cd-433b-b052-1511b1fe9561"
migrations_dir = "migrations"

# Secrets (set with `npx wrangler secret put <NAME>`, never committed):
#   GITHUB_TOKEN    fine-grained token with Contents: read & write on the repo
#   USERS           JSON of usernames to password hashes, made by `npm run users`
#   SESSION_SECRET  any long random string
#   STRIPE_SECRET_KEY       restricted key: Customers, Invoices, Invoice items = Write
#   STRIPE_WEBHOOK_SECRET   signing secret (whsec_...) of the webhook endpoint
#   TURNSTILE_SECRET                         optional spam check (Cloudflare Turnstile)
#   GA_API_SECRET                            optional: GA Measurement Protocol secret
#   GA_SERVICE_ACCOUNT      optional: Google service account JSON key, for the Insights page
