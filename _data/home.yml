intro_title: Bench Notes
intro: |-
  Handcrafted guitars built to order. Each one starts its journey on my bench in Denmark and ends up on stages all around the world.

  Every instrument is carved, wound and set up by hand, for one player. If you can't see what you're after, get in touch. I can probably make it.
