# Top of the page: the intro under the logo.
intro_title: Moar Guitars
intro: |-
  I make a very particular type of guitar incredibly well. Over the last decade, I have been extremely fortunate to become one of the world's most in-demand luthiers. I build instruments by hand, one at a time, in my small home workshop for players on every continent wanting the sound, resonance, feel, response, and comfort that only my guitars offer.
# Opens the general contact form (it asks the default enquiry questions).
reach_out_label: Reach out

# "Enquire" under each guitar opens this form. Name and email are always asked
# first. A guitar can have its own form instead (set in the admin).
enquire_label: Enquire
enquiry_form:
  intro: Tell me a little about what you're after and I'll get back to you.
  fields:
    - label: Where are you based?
      type: text
      required: true
      help: So I can work out shipping.
    - label: What do you play, and what are you looking for?
      type: textarea
      required: true
    - label: Budget
      type: select
      options:
        - Under $5.000
        - $5.000 to $10.000
        - Over $10.000
        - Not sure yet
    - label: When would you like it?
      type: radio
      options:
        - As soon as possible
        - Within a year
        - No rush
    - label: How did you hear about Moar?
      type: select
      options:
        - Instagram
        - Facebook
        - YouTube
        - A friend
        - Saw one played live
        - Other
  submit_label: Send enquiry
  thanks: Thank you. I'll be in touch within a few days.

# Bottom of the page.
fine_print_title: Fine Print
fine_print:
