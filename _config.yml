title: Moar Guitars
description: Handcrafted guitars built to order in Denmark.
url: https://moarguitars.com
baseurl: ""

markdown: kramdown

# Google Analytics 4 measurement ID (e.g. G-ABC123XYZ). Leave empty to turn analytics off.
google_analytics_id: "G-0SN8NVW37D"

# Where enquiry forms are sent (the admin Worker). Empty hides the Enquire link.
# Until admin.moarguitars.com is set up, use the Worker's *.workers.dev address.
enquiry_endpoint: "https://admin.moarguitars.com/api/enquiries"
# Cloudflare Turnstile spam check (site key). Empty turns it off.
turnstile_site_key: ""

collections:
  guitars:
    output: false
    sort_by: order

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - admin
